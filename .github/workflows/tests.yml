name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Run full test suite
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

  windows-ssh:
    name: Windows / SSH transports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Run SSH transport tests
        run: >-
          uv run --python 3.11 --extra dev pytest
          tests/test_paramiko_ssh_backend.py
          tests/test_ssh_control_master.py
          tests/test_transfer_plans.py
