name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install isolated native X11 test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxext6
      - name: Run real Xlib dialog regressions on a dedicated Xvfb
        run: uv run --python ${{ matrix.python-version }} --extra dev python tests/test_x11_dialog_close_native.py -v
      - name: Build distributions
        run: uv build
      - name: Run full test suite
        env:
          VB_TEST_DIST_DIR: ${{ github.workspace }}/dist
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

  windows-ssh:
    name: Windows / SSH transports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Run SSH transport tests
        run: >-
          uv run --python 3.11 --extra dev pytest
          tests/test_paramiko_ssh_backend.py
          tests/test_ssh_control_master.py
          tests/test_transfer_plans.py
          tests/test_tunnel_profiles.py
          tests/test_process_liveness.py
          tests/test_maestro_jobs.py
