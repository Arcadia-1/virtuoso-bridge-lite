<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" width="620" height="490">
  <!-- Architecture illustration for the landing hero. The VB mark is inlined:
       an SVG shown through <img> cannot load other files. -->
  <style>
    .circuit-flow { stroke-dasharray: 10 90; animation: signal 8s linear infinite; }
    .flow-two { animation-delay: -3s; }
    .flow-three { animation-delay: -5s; }
    @keyframes signal { to { stroke-dashoffset: -400; } }
    .core-halo { animation: halo 5s ease-in-out infinite; transform-origin: 310px 252px; }
    @keyframes halo { 50% { opacity: 0.45; transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) {
      .circuit-flow, .core-halo { animation: none; }
    }
  </style>
  <defs>
