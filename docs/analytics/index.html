<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261012" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#10161f" />
    <title>Analytics — Virtuoso Bridge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261012" />
    <script>
      try {
        document.documentElement.classList.toggle(
          "light",
          localStorage.getItem("theme") === "light",
        );
      } catch (e) {}
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a,
      button {
        -webkit-tap-highlight-color: transparent;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #8eb5ff;
        outline-offset: 4px;
      }
    </style>
    <link rel="stylesheet" href="/analytics/dashboard.css?v=20261012" />
    <script type="module" src="/analytics/dashboard.js?v=20261012"></script>
  </head>
  <body class="analytics-body">
    <div id="root"><div class="analytics-loading">Loading analytics…</div></div>
    <noscript
      >JavaScript is required to display the analytics dashboard.
      <a href="/">Back to Virtuoso Bridge</a></noscript
    >
  </body>
</html>
